name: CREDIXCEL fixed12 signed release build

on:
  workflow_dispatch:
  push:
    branches:
      - fixed12-fcm-review
    paths:
      - 'CREDIXCEL-Control-fixed11-fcm-patch.zip'
      - '.github/workflows/fixed12-review-build.yml'

permissions:
  contents: read

jobs:
  fixed12-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated review branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract fixed11 FCM source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f CREDIXCEL-Control-fixed11-fcm-patch.zip
          mkdir -p "$RUNNER_TEMP/credixcel-source"
          unzip -q CREDIXCEL-Control-fixed11-fcm-patch.zip -d "$RUNNER_TEMP/credixcel-source"
          PROJECT="$(find "$RUNNER_TEMP/credixcel-source" -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          test -n "$PROJECT"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Restore Android release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Falta ANDROID_KEYSTORE_BASE64"; exit 1; }
          mkdir -p "$RUNNER_TEMP/credixcel-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/credixcel-signing/credixcel-release.jks"
          test -s "$RUNNER_TEMP/credixcel-signing/credixcel-release.jks"
          chmod 600 "$RUNNER_TEMP/credixcel-signing/credixcel-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/credixcel-signing/credixcel-release.jks" >> "$GITHUB_ENV"

      - name: Apply fixed12 corrections and release version
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])
          gradle_file = root / "android/app/build.gradle.kts"
          text = gradle_file.read_text()

          # The installed 1.2.3 is versionCode 24. The update must be 25.
          text, code_count = re.subn(r'(?m)^(\s*versionCode\s*=\s*)\d+', r'\g<1>25', text)
          text, name_count = re.subn(r'(?m)^(\s*versionName\s*=\s*).+$', r'\g<1>"1.2.4"', text)
          if code_count != 1 or name_count != 1:
              raise SystemExit(f"No se pudo fijar versionCode/versionName de forma inequívoca: code={code_count}, name={name_count}")

          start = text.index('    signingConfigs {')
          end = text.index('\n\n    compileOptions', start)
          replacement = '''    // Release signing uses the repository Actions secrets restored by the workflow.
              val releaseStorePath = System.getenv("ANDROID_KEYSTORE_PATH")
              val releaseStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
              val releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
              val releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
              val hasReleaseSigning = listOf(
                  releaseStorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword
              ).all { !it.isNullOrBlank() }

              if (hasReleaseSigning) {
                  signingConfigs {
                      create("release") {
                          storeFile = file(releaseStorePath!!)
                          storePassword = releaseStorePassword!!
                          keyAlias = releaseKeyAlias!!
                          keyPassword = releaseKeyPassword!!
                      }
                  }
              }'''
          text = text[:start] + replacement + text[end:]

          target = '            signingConfig = signingConfigs.getByName("release")'
          if target not in text:
              raise SystemExit("No se encontró la asignación de signingConfig release esperada")
          text = text.replace(
              target,
              '            if (hasReleaseSigning) signingConfig = signingConfigs.getByName("release")',
              1
          )
          gradle_file.write_text(text)

          service = root / "android/app/src/main/java/com/credixcel/control/messaging/CredixcelMessagingService.kt"
          kotlin = service.read_text()
          start = kotlin.index('                val homeCleared = DeviceActions.clearKioskConfiguration(this)')
          end = kotlin.index('\n            }\n            else -> return', start)
          replacement = '''                // FirebaseMessagingService cannot stop or verify the Activity Lock Task session.
                          // Keep protection active; authenticated MainActivity sync must verify release.
                          prefs.protectionActive = true
                          "UNLOCK_DEFERRED_ACTIVITY_SYNC_UNVERIFIED"'''
          service.write_text(kotlin[:start] + replacement + kotlin[end:])

          print("fixed12: versionName=1.2.4, versionCode=25; release signing configured.")
          PY

      - name: Validate backend syntax
        run: node --check "$PROJECT_DIR/server/src/server.js"

      - name: Build signed Android Release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          gradle --no-daemon -p "$PROJECT_DIR" :android:app:assembleRelease

      - name: Verify APK package, version, and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/android/app/build/outputs/apk/release" -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | grep -E "^package: name='com\.credixcel\.control' versionCode='25' versionName='1\.2\.4'"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CREDIXCEL-fixed12-review-release-1.2.4
          path: ${{ runner.temp }}/credixcel-source/**/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
