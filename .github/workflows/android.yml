              if branch_count != 1:
                  raise SystemExit("No se encontró rama LOCKED en ServerSyncWorker.")
              guard = "if (!policies || !kiosk) return Result.retry()"
              if guard not in worker:
                  raise SystemExit("No se encontró verificación de políticas/kiosco en Worker.")
              worker = worker.replace(guard, guard + "\n                              prefs.lockCommandReady = true", 1)

          # Bump the APK version exactly once.
          if 'versionName = "1.1.6"' not in build or "versionCode = 17" not in build:
              raise SystemExit("La fuente no coincide con 1.1.6 / código 17.")
          build = build.replace("versionCode = 17", "versionCode = 18", 1)
          build = build.replace('versionName = "1.1.6"', 'versionName = "1.1.7"', 1)

          # Assertions guard against silently incomplete patching.
          required = [
              "notificationPermissionLauncher", "requestNotificationPermissionOnce()",
              "prefs.addChangeListener(prefsChangeListener)", "prefs.removeChangeListener(prefsChangeListener)",
              "enterLockTaskIfAuthorized()", "prefs.lockCommandReady = true",
          ]
          for token in required:
