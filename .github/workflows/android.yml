name: Compilar CREDIXCEL Control

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android.yml"
      - "CREDIXCEL-Control-fixed8-sin-bloqueos.zip"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar herramientas Android
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;35.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extraer proyecto Android
        run: |
          unzip -o CREDIXCEL-Control-fixed8-sin-bloqueos.zip -d buildsrc

      - name: Preparar firma
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/credixcel-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/credixcel-signing/credixcel-release.jks"
          test -s "$RUNNER_TEMP/credixcel-signing/credixcel-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/credixcel-signing/credixcel-release.jks" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: |
          cd buildsrc/CREDIXCEL-Control-fixed8-sin-bloqueos/CREDIXCEL-Control
          gradle :android:app:assembleRelease --no-daemon

      - name: Verificar APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find buildsrc/CREDIXCEL-Control-fixed8-sin-bloqueos/CREDIXCEL-Control/android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "APK generado: $APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer -print -quit)"
          test -n "$APKANALYZER"
          "$APKANALYZER" manifest print "$APK" > manifest.txt
          echo "=== Manifiesto ==="
          cat manifest.txt

      - name: Guardar APK y manifiesto
        uses: actions/upload-artifact@v4
        with:
          name: CREDIXCEL-Control-Release
          path: |
            buildsrc/CREDIXCEL-Control-fixed8-sin-bloqueos/CREDIXCEL-Control/android/app/build/outputs/apk/release/*.apk
            manifest.txt
          if-no-files-found: error
