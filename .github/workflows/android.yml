name: Compilar CREDIXCEL Control

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android.yml"
      - "CREDIXCEL-Control-fixed9-sin-bloqueos*.zip"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar herramientas Android
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;35.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extraer proyecto Android
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -name 'CREDIXCEL-Control-fixed9-sin-bloqueos.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "No se encontró el ZIP fixed9 en la raíz del repositorio."
            ls -la
            exit 1
          fi
          echo "ZIP encontrado: $ZIP"
          unzip -o "$ZIP" -d buildsrc
          PROJECT_DIR="$(find buildsrc -type f -path '*/CREDIXCEL-Control/android/app/build.gradle.kts' -print -quit | sed 's#/android/app/build.gradle.kts##')"
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find buildsrc -type f -path '*/CREDIXCEL-Control/android/app/build.gradle' -print -quit | sed 's#/android/app/build.gradle##')"
          fi
          if [ -z "$PROJECT_DIR" ]; then
            echo "No se encontró el proyecto Android dentro del ZIP."
            find buildsrc -maxdepth 8 -type f \( -name build.gradle -o -name build.gradle.kts \)
            exit 1
          fi
          echo "Proyecto Android encontrado: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Corregir versión de Android
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="$PROJECT_DIR/android/app"
          BUILD_FILE=""
          for candidate in "$APP_DIR/build.gradle.kts" "$APP_DIR/build.gradle"; do
            if [ -f "$candidate" ]; then BUILD_FILE="$candidate"; break; fi
          done
          if [ -z "$BUILD_FILE" ]; then
            echo "No se encontró build.gradle(.kts) en $APP_DIR"
            find buildsrc -maxdepth 7 -type f \( -name build.gradle -o -name build.gradle.kts \)
            exit 1
          fi
          python3 - "$BUILD_FILE" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          lines = p.read_text().splitlines()
          code_hits = [i for i, line in enumerate(lines) if line.strip().startswith("versionCode")]
          name_hits = [i for i, line in enumerate(lines) if line.strip().startswith("versionName")]
          if len(code_hits) != 1 or len(name_hits) != 1:
              raise SystemExit(f"No se pudo actualizar de forma segura: versionCode={len(code_hits)}, versionName={len(name_hits)}")
          for i in code_hits:
              indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
              lines[i] = indent + "versionCode = 4"
          for i in name_hits:
              indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
              lines[i] = indent + 'versionName = "1.0.3"'
          p.write_text("\n".join(lines) + "\n")
          print(f"Versión actualizada en {p}: versionCode=4, versionName=1.0.3")
          PY

      - name: Preparar firma
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/credixcel-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/credixcel-signing/credixcel-release.jks"
          test -s "$RUNNER_TEMP/credixcel-signing/credixcel-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/credixcel-signing/credixcel-release.jks" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle :android:app:assembleRelease --no-daemon

      - name: Verificar APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/android/app/build/outputs/apk/release" -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "APK generado: $APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer -print -quit)"
          test -n "$APKANALYZER"
          "$APKANALYZER" manifest print "$APK" > manifest.txt
          echo "=== Manifiesto ==="
          cat manifest.txt

      - name: Guardar APK y manifiesto
        uses: actions/upload-artifact@v4
        with:
          name: CREDIXCEL-Control-Release
          path: |
            buildsrc/**/CREDIXCEL-Control/android/app/build/outputs/apk/release/*.apk
            manifest.txt
          if-no-files-found: error
