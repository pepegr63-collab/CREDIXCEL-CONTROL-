name: CREDIXCEL server syntax check

on:
  push:
    branches:
      - fix/confirmed-lock-contract-unlock
    paths:
      - 'server.js'
      - 'public/index.html'
      - '.github/workflows/server-check.yml'
  pull_request:
    branches:
      - feature/imei-panel-postgres
    paths:
      - 'server.js'
      - 'public/index.html'
      - '.github/workflows/server-check.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check server JavaScript syntax
        run: node --check server.js
      - name: Check inline admin panel JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('public/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>([\\s\\S]*?)</script>', html)
          if len(scripts) != 1:
              raise SystemExit(f'Expected one inline script, found {len(scripts)}')
          Path('/tmp/credixcel-admin.js').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/credixcel-admin.js
