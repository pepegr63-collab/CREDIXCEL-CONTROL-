name: Compilar CREDIXCEL Control

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android.yml"
      - "CREDIXCEL-Control-fixed10-sin-bloqueos.zip"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar plataforma y build-tools Android
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" || { echo "No se encontró sdkmanager en el runner."; env | grep -E 'ANDROID|JAVA_HOME' || true; exit 1; }
          echo "SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extraer fuente 1.0.9
        shell: bash
        run: |
          set -euo pipefail
          ZIP="CREDIXCEL-Control-fixed10-sin-bloqueos.zip"
          test -s "$ZIP" || { echo "No se encontró $ZIP en la raíz."; ls -la; exit 1; }
          unzip -t "$ZIP"
          unzip -o "$ZIP" -d buildsrc
          PROJECT_DIR="$(find buildsrc -type f -path '*/CREDIXCEL-Control/android/app/build.gradle.kts' -print -quit | sed 's#/android/app/build.gradle.kts##')"
          test -n "$PROJECT_DIR" || { echo "No se encontró android/app/build.gradle.kts dentro del ZIP."; find buildsrc -maxdepth 8 -type f -name 'build.gradle*'; exit 1; }
          echo "Proyecto detectado: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verificar lógica de bloqueo y recuperación de la fuente
        shell: bash
        run: |
          set -euo pipefail
          MAIN="$PROJECT_DIR/android/app/src/main/java/com/credixcel/control/MainActivity.kt"
          DEVICE="$PROJECT_DIR/android/app/src/main/java/com/credixcel/control/device/DeviceActions.kt"
          PREFS="$PROJECT_DIR/android/app/src/main/java/com/credixcel/control/data/Prefs.kt"
          test -s "$MAIN"
          test -s "$DEVICE"
          test -s "$PREFS"
          python3 - "$MAIN" "$DEVICE" "$PREFS" <<'PY'
          import pathlib, sys
          main, device, prefs = [pathlib.Path(x).read_text() for x in sys.argv[1:]]
          checks = {
              "LOCKED se procesa sin condición de contrato": 'device == "LOCKED" -> activateKiosk()' in main,
              "liberación exige ACTIVE + ACTIVE": 'device == "ACTIVE" && contract == "ACTIVE" -> releaseKiosk()' in main,
              "recuperación al volver a iniciar": 'override fun onResume()' in main and 'prefs.protectionActive' in main and 'DeviceActions.configureKiosk(this)' in main,
              "HOME persistente bajo Device Owner": 'addPersistentPreferredActivity' in device and 'MainActivity::class.java' in device,
              "estado de bloqueo se conserva entre reinicios": 'protection_active' in prefs,
              "errores de sincronización no liberan": 'Se conserva el último estado local autorizado' in main,
          }
          for label, ok in checks.items():
              print(("OK: " if ok else "ERROR: ") + label)
          if not all(checks.values()):
              raise SystemExit("La fuente ZIP no cumple los criterios requeridos; se cancela antes de compilar.")
          PY

      - name: Corregir retorno al HOME real del Motorola y versionar 1.1.0
        shell: bash
        run: |
          set -euo pipefail
          MAIN="$PROJECT_DIR/android/app/src/main/java/com/credixcel/control/MainActivity.kt"
          BUILD="$PROJECT_DIR/android/app/build.gradle.kts"
          python3 - "$MAIN" "$BUILD" <<'PY'
          import pathlib, sys
          main = pathlib.Path(sys.argv[1])
          build = pathlib.Path(sys.argv[2])
          s = main.read_text()
          old = """        // Once the persistent HOME preference is cleared, Android resolves HOME to the user's launcher.
                  val homeIntent = Intent(Intent.ACTION_MAIN).apply {
                      addCategory(Intent.CATEGORY_HOME)
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                  }
                  runCatching { startActivity(homeIntent) }
          """
          new = """        // Launch the actual system launcher explicitly; CREDIXCEL also declares a HOME filter.
                  val homeOpened = openSystemHome()

          """
          if old not in s:
              raise SystemExit("No se encontró el bloque HOME esperado; se cancela el parche.")
          s = s.replace(old, new, 1)
          # No declarar liberado localmente si Android no confirmó la limpieza de kiosk/políticas.
          s = s.replace(
              "        prefs.protectionActive = false",
              "        if (lockTaskStopped && kioskCleared && policiesReleased) prefs.protectionActive = false",
              1
          )
          anchor = "    private fun releaseKiosk(): String {"
          helper = """    /** Open Android's resolved HOME only when it is a real external launcher, never guess. */
          private fun openSystemHome(): Boolean {
              val homeIntent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME)
              val launcher = packageManager.resolveActivity(
                  homeIntent,
                  android.content.pm.PackageManager.MATCH_DEFAULT_ONLY
              )?.activityInfo ?: return false
              if (launcher.packageName == packageName ||
                  launcher.name.endsWith(".ResolverActivity")) return false

              val homeComponent = android.content.ComponentName(launcher.packageName, launcher.name)
              return runCatching {
                  startActivity(homeIntent.apply {
                      component = homeComponent
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                  })
                  true
              }.getOrDefault(false)
          }

          """
          if anchor not in s:
              raise SystemExit("No se encontró releaseKiosk para insertar el selector de HOME.")
          s = s.replace(anchor, helper + anchor, 1)
          s = s.replace(
              "            lockTaskStopped && kioskCleared && policiesReleased ->\n                \"Liberación completada: Lock Task retirado, políticas liberadas y HOME normal solicitado.\"\n            else ->\n                \"Se recibió ACTIVE + ACTIVE y se detuvo la restricción local. Atención: alguna limpieza de políticas o HOME no se confirmó (Lock Task=$lockTaskStopped, HOME=$kioskCleared, políticas=$policiesReleased).\"",
              "            lockTaskStopped && kioskCleared && policiesReleased && homeOpened ->\n                \"Liberación completada: Lock Task retirado, políticas liberadas y HOME real del Motorola abierto.\"\n            else ->\n                \"Se recibió ACTIVE + ACTIVE. Resultado: Lock Task=$lockTaskStopped, HOME limpiado=$kioskCleared, HOME del Motorola abierto=$homeOpened, políticas=$policiesReleased.\"",
              1
          )
          main.write_text(s)
          b = build.read_text()
          if "versionCode = 10" not in b or 'versionName = "1.0.9"' not in b:
              raise SystemExit("La versión de origen no coincide con 1.0.9; se cancela el versionado.")
          b = b.replace("versionCode = 10", "versionCode = 11", 1).replace('versionName = "1.0.9"', 'versionName = "1.1.0"', 1)
          build.write_text(b)
          print("OK: HOME explícito y versión 1.1.0.")
          PY


      - name: Corregir liberación segura y HOME Motorola para 1.1.1
        shell: bash
        run: |
          set -euo pipefail
          MAIN="$PROJECT_DIR/android/app/src/main/java/com/credixcel/control/MainActivity.kt"
          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"
          BUILD="$PROJECT_DIR/android/app/build.gradle.kts"
          python3 - "$MAIN" "$MANIFEST" "$BUILD" <<'PY'
          import pathlib, sys
          main_path, manifest_path, build_path = map(pathlib.Path, sys.argv[1:])
          s = main_path.read_text()
          old = """        if (lockTaskStopped && kioskCleared && policiesReleased) prefs.protectionActive = false

                  // Launch the actual system launcher explicitly; CREDIXCEL also declares a HOME filter.
                  val homeOpened = openSystemHome()
          """
          new = """        // Do not mark the device released until Android accepted the external HOME launch too.
                  val homeOpened = if (prefs.protectionActive || !lockTaskStopped || !kioskCleared) {
                      openSystemHome()
                  } else {
                      true
                  }
                  if (lockTaskStopped && kioskCleared && policiesReleased && homeOpened) {
                      prefs.protectionActive = false
                  }
          """
          if old not in s:
              raise SystemExit("No se encontró el bloque de confirmación de liberación esperado.")
          s = s.replace(old, new, 1)
          # Verify the selector patched in the preceding step without brittle indentation matching.
          if 'packageManager.resolveActivity(' not in s or 'launcher.packageName == packageName' not in s or 'launcher.name.endsWith(".ResolverActivity")' not in s:
              raise SystemExit("No se encontró el selector HOME externo basado en resolveActivity después del parche.")
          old_active = 'device == "ACTIVE" && contract == "ACTIVE" -> releaseKiosk()'
          new_active = '''device == "ACTIVE" && contract == "ACTIVE" -> {
                                              val manager = getSystemService(ActivityManager::class.java)
                                              val kioskStillPresent = prefs.protectionActive ||
                                                  manager.lockTaskModeState != ActivityManager.LOCK_TASK_MODE_NONE ||
                                                  DeviceActions.isLockTaskPermitted(this@MainActivity)
                                              if (kioskStillPresent) releaseKiosk()
                                              else "Servidor y contrato ACTIVE. El equipo ya estaba liberado; no se modificó el HOME."
                                          }'''
          if old_active not in s:
              raise SystemExit("No se encontró la rama ACTIVE + ACTIVE esperada.")
          s = s.replace(old_active, new_active, 1)
          main_path.write_text(s)

          m = manifest_path.read_text()
          if "<queries>" not in m:
              marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
              if marker not in m:
                  raise SystemExit("No se encontró la raíz del AndroidManifest.")
              m = m.replace(marker, marker + """
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.HOME" />
                      <category android:name="android.intent.category.DEFAULT" />
                  </intent>
              </queries>""", 1)
          manifest_path.write_text(m)

          b = build_path.read_text()
          if 'versionCode = 11' not in b or 'versionName = "1.1.0"' not in b:
              raise SystemExit("La fuente no está en la versión 1.1.0 esperada antes del endurecimiento.")
          b = b.replace("versionCode = 11", "versionCode = 12", 1)
          b = b.replace('versionName = "1.1.0"', 'versionName = "1.1.1"', 1)
          build_path.write_text(b)

          # Post-patch checks: validate the resulting source, not just the ZIP input.
          final = main_path.read_text()
          assert 'device == "ACTIVE" && contract == "ACTIVE" -> {' in final
          assert 'DeviceActions.isLockTaskPermitted(this@MainActivity)' in final
          assert 'policiesReleased && homeOpened' in final
          assert 'packageManager.resolveActivity(' in final
          assert 'launcher.packageName == packageName' in final
          assert 'launcher.name.endsWith(".ResolverActivity")' in final
          assert '<queries>' in manifest_path.read_text()
          print("OK: liberación solo con HOME externo confirmado, sin redirección al sincronizar un equipo ya ACTIVE, visibilidad HOME declarada y versión 1.1.1.")
          PY

      - name: Corregir salida al HOME aun con restricción local INACTIVA y versionar 1.1.3
        shell: bash
        run: |
          set -euo pipefail
          MAIN="$PROJECT_DIR/android/app/src/main/java/com/credixcel/control/MainActivity.kt"
          BUILD="$PROJECT_DIR/android/app/build.gradle.kts"
          python3 - "$MAIN" "$BUILD" <<'PY'
          import pathlib, sys
          main_path, build_path = map(pathlib.Path, sys.argv[1:])
          s = main_path.read_text()
          old = """        val homeOpened = if (prefs.protectionActive || !lockTaskStopped || !kioskCleared) {
                      openSystemHome()
                  } else {
                      true
                  }
                  if (lockTaskStopped && kioskCleared && policiesReleased && homeOpened) {
                      prefs.protectionActive = false
                  }"""
          new = """        // Only launch the external HOME after every kiosk and policy cleanup succeeds.
                  // If any cleanup step fails, keep CREDIXCEL visible and preserve the local restriction state.
                  val cleanupConfirmed = lockTaskStopped && kioskCleared && policiesReleased
                  val homeOpened = cleanupConfirmed && openSystemHome()
                  if (cleanupConfirmed && homeOpened) {
                      prefs.protectionActive = false
                      finish()
                  }"""
          if old not in s:
              raise SystemExit("No se encontró la condición HOME de 1.1.1; no se modifica la fuente.")
          s = s.replace(old, new, 1)
          if "val homeOpened = cleanupConfirmed && openSystemHome()" not in s or "finish()" not in s:
              raise SystemExit("La corrección HOME no quedó aplicada.")
          main_path.write_text(s)
          b = build_path.read_text()
          if "versionCode = 12" not in b or 'versionName = "1.1.1"' not in b:
              raise SystemExit("La fuente no coincide con 1.1.1 antes del versionado.")
          b = b.replace("versionCode = 12", "versionCode = 14", 1)
          b = b.replace('versionName = "1.1.1"', 'versionName = "1.1.3"', 1)
          build_path.write_text(b)
          print("OK: HOME externo solo se abre tras confirmar toda la limpieza; versión 1.1.3.")
          PY

      - name: Endurecer liberación con rollback y versionar 1.1.4
        shell: bash
        run: |
          set -euo pipefail
          MAIN="$PROJECT_DIR/android/app/src/main/java/com/credixcel/control/MainActivity.kt"
          BUILD="$PROJECT_DIR/android/app/build.gradle.kts"
          python3 - "$MAIN" "$BUILD" <<'PY'
          import pathlib, sys
          main_path, build_path = map(pathlib.Path, sys.argv[1:])
          s = main_path.read_text()
          anchor = "    private fun releaseKiosk(): String {"
          end_anchor = "\n\n    @Composable"
          start = s.find(anchor)
          end = s.find(end_anchor, start)
          if start < 0 or end < 0:
              raise SystemExit("No se encontró exactamente la función releaseKiosk.")
          replacement = '''    /** Re-establish the authorized restriction if any release operation fails. */
              private fun restoreKioskAfterFailedRelease(): Boolean {
                  prefs.protectionActive = true
                  val policiesRestored = DeviceActions.applyFinancingProtection(this)
                  val kioskConfigured = DeviceActions.configureKiosk(this) &&
                      DeviceActions.isLockTaskPermitted(this)
                  val lockTaskRestored = if (kioskConfigured) {
                      runCatching {
                          val manager = getSystemService(ActivityManager::class.java)
                          if (manager.lockTaskModeState == ActivityManager.LOCK_TASK_MODE_NONE) {
                              startLockTask()
                          }
                          manager.lockTaskModeState != ActivityManager.LOCK_TASK_MODE_NONE
                      }.getOrDefault(false)
                  } else false
                  return policiesRestored && kioskConfigured && lockTaskRestored
              }

              private fun releaseKiosk(): String {
                  if (!DeviceActions.isDeviceOwner(this)) {
                      return "El servidor confirmó ACTIVE + ACTIVE, pero CREDIXCEL ya no es Device Owner. Se conserva el estado local."
                  }

                  // Remove policies first; retain Lock Task and managed HOME until that succeeds.
                  val policiesReleased = DeviceActions.releaseFinancingProtection(this)
                  if (!policiesReleased) {
                      val rollback = restoreKioskAfterFailedRelease()
                      return "No se pudo retirar todas las políticas. Se restauró la protección: $rollback."
                  }

                  val lockTaskStopped = runCatching {
                      val manager = getSystemService(ActivityManager::class.java)
                      if (manager.lockTaskModeState != ActivityManager.LOCK_TASK_MODE_NONE) stopLockTask()
                      manager.lockTaskModeState == ActivityManager.LOCK_TASK_MODE_NONE
                  }.getOrDefault(false)
                  if (!lockTaskStopped) {
                      val rollback = restoreKioskAfterFailedRelease()
                      return "Android no confirmó la salida de Lock Task. Se restauró la protección: $rollback."
                  }

                  val kioskCleared = DeviceActions.clearKioskConfiguration(this)
                  if (!kioskCleared) {
                      val rollback = restoreKioskAfterFailedRelease()
                      return "No se pudo limpiar la configuración de kiosco. Se restauró la protección: $rollback."
                  }

                  // Keep the durable local lock until the external Android launcher is opened.
                  val homeOpened = openSystemHome()
                  if (!homeOpened) {
                      val rollback = restoreKioskAfterFailedRelease()
                      return "No se pudo abrir el HOME del Motorola. Se restauró la protección: $rollback."
                  }

                  prefs.protectionActive = false
                  finish()
                  return "Liberación completada: políticas retiradas, Lock Task detenido y HOME real del Motorola abierto."
              }'''
          s = s[:start] + replacement + s[end:]
          required = ["restoreKioskAfterFailedRelease", "if (!policiesReleased)", "if (!lockTaskStopped)", "if (!kioskCleared)", "if (!homeOpened)", "prefs.protectionActive = false", "finish()"]
          if not all(x in s for x in required):
              raise SystemExit("Falló una verificación de la liberación transaccional.")
          main_path.write_text(s)
          b = build_path.read_text()
          if "versionCode = 14" not in b or 'versionName = "1.1.3"' not in b:
              raise SystemExit("La fuente no coincide con 1.1.3 antes del versionado.")
          b = b.replace("versionCode = 14", "versionCode = 15", 1)
          b = b.replace('versionName = "1.1.3"', 'versionName = "1.1.4"', 1)
          build_path.write_text(b)
          print("OK: rollback de protección ante cada fallo; versión 1.1.4.")
          PY

      - name: Validar HOME real y versionar 1.1.5
        shell: bash
        run: |
          set -euo pipefail
          MAIN="$PROJECT_DIR/android/app/src/main/java/com/credixcel/control/MainActivity.kt"
          BUILD="$PROJECT_DIR/android/app/build.gradle.kts"
          python3 - "$MAIN" "$BUILD" <<'PY'
          import pathlib, re, sys
          main_path, build_path = map(pathlib.Path, sys.argv[1:])
          source = main_path.read_text()
          build = build_path.read_text()

          # El selector HOME ya fue instalado por los pasos anteriores.
          # Validarlo sin depender de su sangría exacta.
          checks = {
              "HOME usa el selector Android de launchers": "packageManager.resolveActivity(" in source,
              "HOME excluye la propia aplicación": "launcher.packageName == packageName" in source,
              "HOME evita ResolverActivity": '".ResolverActivity"' in source,
              "HOME inicia el componente seleccionado": "startActivity(homeIntent.apply" in source,
          }
          for label, ok in checks.items():
              print(("OK: " if ok else "ERROR: ") + label)
          if not all(checks.values()):
              raise SystemExit("El selector HOME no superó las comprobaciones; se cancela la compilación.")

          if "versionCode = 15" not in build or 'versionName = "1.1.4"' not in build:
              raise SystemExit("La fuente no coincide con 1.1.4 / código 15.")
          build = build.replace("versionCode = 15", "versionCode = 16", 1)
          build = build.replace('versionName = "1.1.4"', 'versionName = "1.1.5"', 1)
          build_path.write_text(build)
          print("OK: HOME validado y versión 1.1.5 / código 16.")
          PY

      - name: Verificar liberación transaccional antes de publicar
        shell: bash
        run: |
          set -euo pipefail
          MAIN="$PROJECT_DIR/android/app/src/main/java/com/credixcel/control/MainActivity.kt"
          BUILD="$PROJECT_DIR/android/app/build.gradle.kts"
          python3 - "$MAIN" "$BUILD" <<'PY'
          import pathlib, sys
          main, build = [pathlib.Path(x).read_text() for x in sys.argv[1:]]
          checks = {
              "rollback reactiva políticas y kiosco": "restoreKioskAfterFailedRelease" in main and "applyFinancingProtection(this)" in main and "configureKiosk(this)" in main,
              "políticas se retiran antes de salir de Lock Task": main.index("val policiesReleased = DeviceActions.releaseFinancingProtection(this)") < main.index("val lockTaskStopped = runCatching"),
              "cada fallo ejecuta rollback": all(x in main for x in ["if (!policiesReleased)", "if (!lockTaskStopped)", "if (!kioskCleared)", "if (!homeOpened)"]),
              "estado local se limpia al final": main.index("val homeOpened = openSystemHome()") < main.index("prefs.protectionActive = false"),
              "HOME externo termina la Activity": main.index("prefs.protectionActive = false") < main.index("finish()"),
              "HOME se obtiene del launcher resuelto por Android y excluye CREDIXCEL": "packageManager.resolveActivity(" in main and "launcher.packageName == packageName" in main and "launcher.name.endsWith(\".ResolverActivity\")" in main,
              "versión 1.1.5 / código 16": 'versionName = "1.1.5"' in build and "versionCode = 16" in build,
          }
          for label, ok in checks.items():
              print(("OK: " if ok else "ERROR: ") + label)
          if not all(checks.values()):
              raise SystemExit("La validación de liberación transaccional falló.")
          PY

      - name: Incorporar sincronización automática segura y versionar 1.1.6
        shell: bash
        run: |
          set -euo pipefail
          MAIN="$PROJECT_DIR/android/app/src/main/java/com/credixcel/control/MainActivity.kt"
          PREFS="$PROJECT_DIR/android/app/src/main/java/com/credixcel/control/data/Prefs.kt"
          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"
          BUILD="$PROJECT_DIR/android/app/build.gradle.kts"
          WORKER_DIR="$PROJECT_DIR/android/app/src/main/java/com/credixcel/control/sync"
          mkdir -p "$WORKER_DIR"
          cat > "$WORKER_DIR/ServerSyncWorker.kt" <<'KOTLIN'
          package com.credixcel.control.sync

          import android.Manifest
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import androidx.core.app.NotificationCompat
          import androidx.core.app.NotificationManagerCompat
          import androidx.core.content.ContextCompat
          import androidx.work.CoroutineWorker
          import androidx.work.WorkerParameters
          import com.credixcel.control.MainActivity
          import com.credixcel.control.data.Prefs
          import com.credixcel.control.device.DeviceActions
          import com.credixcel.control.network.CredixcelApi
          import kotlinx.serialization.json.Json
          import okhttp3.OkHttpClient
          import okhttp3.MediaType.Companion.toMediaType
          import retrofit2.Retrofit
          import retrofit2.converter.kotlinx.serialization.asConverterFactory
          import java.net.URL

          /**
           * Periodically reads server authorization. It never attempts to stop Lock Task
           * or launch an Activity from the background: Android requires the foreground
           * Activity to complete those operations safely.
           */
          class ServerSyncWorker(
              appContext: Context,
              params: WorkerParameters
          ) : CoroutineWorker(appContext, params) {

              override suspend fun doWork(): Result {
                  val prefs = Prefs(applicationContext)
                  val id = prefs.deviceId ?: return Result.success()
                  val token = prefs.token ?: return Result.success()

                  return try {
                      val state = api(prefs.serverUrl).sync(
                          mapOf("deviceId" to id, "deviceToken" to token)
                      )
                      val device = state.status.trim().uppercase()
                      val contract = state.contractStatus?.trim()?.uppercase()
                      prefs.lastDeviceStatus = device
                      prefs.lastContractStatus = contract

                      when {
                          device == "LOCKED" -> {
                              // Persist the command and DPM policies before asking the user
                              // to bring the HOME Activity forward to enter Lock Task.
                              prefs.pendingRelease = false
                              prefs.protectionActive = true
                              val policies = DeviceActions.applyFinancingProtection(applicationContext)
                              val kiosk = DeviceActions.configureKiosk(applicationContext) &&
                                  DeviceActions.isLockTaskPermitted(applicationContext)
                              if (!policies || !kiosk) return Result.retry()
                              postActionNotification(
                                  applicationContext,
                                  "CREDIXCEL: bloqueo autorizado",
                                  "Toca esta notificación para activar Lock Task."
                              )
                          }
                          device == "ACTIVE" && contract == "ACTIVE" -> {
                              val restrictionPresent = prefs.protectionActive ||
                                  DeviceActions.isLockTaskPermitted(applicationContext)
                              if (restrictionPresent) {
                                  val newlyPending = !prefs.pendingRelease
                                  prefs.pendingRelease = true
                                  if (newlyPending) {
                                      postActionNotification(
                                          applicationContext,
                                          "CREDIXCEL: equipo autorizado para liberar",
                                          "Toca esta notificación para volver al HOME normal del Motorola."
                                      )
                                  }
                              } else {
                                  prefs.pendingRelease = false
                              }
                          }
                          // Unknown, overdue, partial, and network/auth errors never release.
                          else -> Unit
                      }
                      Result.success()
                  } catch (_: Exception) {
                      Result.retry()
                  }
              }

              private fun api(rawUrl: String): CredixcelApi {
                  val normalized = rawUrl.trim().trimEnd('/')
                  require(normalized.startsWith("https://", ignoreCase = true))
                  val parsed = URL(normalized)
                  require(parsed.host.isNotBlank())
                  val json = Json { ignoreUnknownKeys = true }
                  return Retrofit.Builder()
                      .baseUrl("$normalized/")
                      .client(OkHttpClient.Builder().build())
                      .addConverterFactory(json.asConverterFactory("application/json".toMediaType()))
                      .build()
                      .create(CredixcelApi::class.java)
              }

              private fun postActionNotification(context: Context, title: String, message: String) {
                  if (Build.VERSION.SDK_INT >= 33 &&
                      ContextCompat.checkSelfPermission(context, Manifest.permission.POST_NOTIFICATIONS) !=
                      PackageManager.PERMISSION_GRANTED) return

                  val manager = context.getSystemService(NotificationManager::class.java)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      manager.createNotificationChannel(
                          NotificationChannel(CHANNEL_ID, "Estado CREDIXCEL", NotificationManager.IMPORTANCE_HIGH)
                      )
                  }
                  val intent = Intent(context, MainActivity::class.java).apply {
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                  }
                  val pending = PendingIntent.getActivity(
                      context, NOTIFICATION_ID, intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  val notification = NotificationCompat.Builder(context, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.ic_lock_lock)
                      .setContentTitle(title)
                      .setContentText(message)
                      .setStyle(NotificationCompat.BigTextStyle().bigText(message))
                      .setContentIntent(pending)
                      .setAutoCancel(true)
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .build()
                  NotificationManagerCompat.from(context).notify(NOTIFICATION_ID, notification)
              }

              companion object {
                  const val WORK_NAME = "credixcel_server_sync"
                  private const val CHANNEL_ID = "credixcel_authorization"
                  private const val NOTIFICATION_ID = 4101
              }
          }
          KOTLIN

          python3 - "$MAIN" "$PREFS" "$MANIFEST" "$BUILD" <<'PY'
          import pathlib, sys
          main_path, prefs_path, manifest_path, build_path = map(pathlib.Path, sys.argv[1:])
