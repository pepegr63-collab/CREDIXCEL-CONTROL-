name: Compilar CREDIXCEL Control

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android.yml"
      - "CREDIXCEL-Control-fixed10-sin-bloqueos.zip"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar plataforma y build-tools Android
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" || { echo "No se encontró sdkmanager en el runner."; env | grep -E 'ANDROID|JAVA_HOME' || true; exit 1; }
          echo "SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extraer fuente 1.0.9
        shell: bash
        run: |
          set -euo pipefail
          ZIP="CREDIXCEL-Control-fixed10-sin-bloqueos.zip"
          test -s "$ZIP" || { echo "No se encontró $ZIP en la raíz."; ls -la; exit 1; }
          unzip -t "$ZIP"
          unzip -o "$ZIP" -d buildsrc
          PROJECT_DIR="$(find buildsrc -type f -path '*/CREDIXCEL-Control/android/app/build.gradle.kts' -print -quit | sed 's#/android/app/build.gradle.kts##')"
          test -n "$PROJECT_DIR" || { echo "No se encontró android/app/build.gradle.kts dentro del ZIP."; find buildsrc -maxdepth 8 -type f -name 'build.gradle*'; exit 1; }
          echo "Proyecto detectado: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Validar que LOCKED siempre mantenga Lock Task
        shell: bash
        run: |
          set -euo pipefail
          MAIN="$PROJECT_DIR/android/app/src/main/java/com/credixcel/control/MainActivity.kt"
          test -f "$MAIN"
          python3 - "$MAIN" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          expected = 'device == "LOCKED" -> activateKiosk()'
          if expected not in s:
              raise SystemExit("ERROR: la fuente no activa/mantiene Lock Task ante LOCKED sin depender del estado del contrato.")
          if 'device == "LOCKED" && contract == "ACTIVE" -> activateKiosk()' in s:
              raise SystemExit("ERROR: se detectó la condición incorrecta LOCKED + ACTIVE; LOCKED debe prevalecer por sí solo.")
          print("OK: LOCKED activa/mantiene Lock Task independientemente del estado del contrato.")
          PY
          grep -n -A2 -B2 'device == "LOCKED"' "$MAIN"

      - name: Corregir retorno al HOME real del Motorola y versionar 1.1.0
        shell: bash
        run: |
          set -euo pipefail
          MAIN="$PROJECT_DIR/android/app/src/main/java/com/credixcel/control/MainActivity.kt"
          BUILD="$PROJECT_DIR/android/app/build.gradle.kts"
          python3 - "$MAIN" "$BUILD" <<'PY'
          import pathlib, sys
          main = pathlib.Path(sys.argv[1])
          build = pathlib.Path(sys.argv[2])
          s = main.read_text()
          old = """        // Once the persistent HOME preference is cleared, Android resolves HOME to the user's launcher.
                  val homeIntent = Intent(Intent.ACTION_MAIN).apply {
                      addCategory(Intent.CATEGORY_HOME)
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                  }
                  runCatching { startActivity(homeIntent) }
          """
          new = """        // Launch the actual system launcher explicitly; CREDIXCEL also declares a HOME filter.
                  val homeOpened = openSystemHome()

          """
          if old not in s:
              raise SystemExit("No se encontró el bloque HOME esperado; se cancela el parche.")
          s = s.replace(old, new, 1)
          anchor = "    private fun releaseKiosk(): String {"
          helper = """    /** Opens the real Android launcher, excluding CREDIXCEL's own HOME activity. */
          private fun openSystemHome(): Boolean {
              val homeIntent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME)
              val launchers = packageManager.queryIntentActivities(homeIntent, 0)
              val launcher = launchers.firstOrNull { it.activityInfo.packageName != this.packageName }
                  ?.activityInfo ?: return false
              val component = android.content.ComponentName(launcher.packageName, launcher.name)

              return runCatching {
                  startActivity(Intent(Intent.ACTION_MAIN).apply {
                      addCategory(Intent.CATEGORY_HOME)
                      this.component = component
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                  })
                  true
              }.getOrDefault(false)
          }

          """
          if anchor not in s:
              raise SystemExit("No se encontró releaseKiosk para insertar el selector de HOME.")
          s = s.replace(anchor, helper + anchor, 1)
          s = s.replace(
              "            lockTaskStopped && kioskCleared && policiesReleased ->\n                \"Liberación completada: Lock Task retirado, políticas liberadas y HOME normal solicitado.\"\n            else ->\n                \"Se recibió ACTIVE + ACTIVE y se detuvo la restricción local. Atención: alguna limpieza de políticas o HOME no se confirmó (Lock Task=$lockTaskStopped, HOME=$kioskCleared, políticas=$policiesReleased).\"",
              "            lockTaskStopped && kioskCleared && policiesReleased && homeOpened ->\n                \"Liberación completada: Lock Task retirado, políticas liberadas y HOME real del Motorola abierto.\"\n            else ->\n                \"Se recibió ACTIVE + ACTIVE. Resultado: Lock Task=$lockTaskStopped, HOME limpiado=$kioskCleared, HOME del Motorola abierto=$homeOpened, políticas=$policiesReleased.\"",
              1
          )
          main.write_text(s)
          b = build.read_text()
          if "versionCode = 10" not in b or 'versionName = "1.0.9"' not in b:
              raise SystemExit("La versión de origen no coincide con 1.0.9; se cancela el versionado.")
          b = b.replace("versionCode = 10", "versionCode = 11", 1).replace('versionName = "1.0.9"', 'versionName = "1.1.0"', 1)
          build.write_text(b)
          print("OK: HOME explícito y versión 1.1.0.")
          PY

      - name: Publicar fuente exacta compilada
        uses: actions/upload-artifact@v4
        with:
          name: CREDIXCEL-Control-Fuente-1.1.0
          path: |
            buildsrc/**/CREDIXCEL-Control/android/app/src/**
            buildsrc/**/CREDIXCEL-Control/android/app/build.gradle.kts
            buildsrc/**/CREDIXCEL-Control/build.gradle.kts
            buildsrc/**/CREDIXCEL-Control/settings.gradle.kts
            buildsrc/**/CREDIXCEL-Control/gradle.properties
          if-no-files-found: error
          retention-days: 3

      - name: Preparar firma
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Falta el secreto ANDROID_KEYSTORE_BASE64."; exit 1; }
          mkdir -p "$RUNNER_TEMP/credixcel-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/credixcel-signing/credixcel-release.jks"
          test -s "$RUNNER_TEMP/credixcel-signing/credixcel-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/credixcel-signing/credixcel-release.jks" >> "$GITHUB_ENV"

      - name: Compilar APK Release
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle :android:app:assembleRelease --no-daemon

      - name: Verificar firma y versión
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/android/app/build/outputs/apk/release" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK" || { echo "No se generó APK Release."; exit 1; }
          echo "APK generado: $APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer -print -quit)"
          test -n "$APKANALYZER"
          "$APKANALYZER" manifest version-code "$APK"
          "$APKANALYZER" manifest version-name "$APK"
          "$APKANALYZER" manifest application-id "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/CREDIXCEL-Control-1.1.0.apk"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: CREDIXCEL-Control-1.1.0-Release
          path: CREDIXCEL-Control-1.1.0.apk
          if-no-files-found: error
          retention-days: 30
