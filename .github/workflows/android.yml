      - name: Corregir HOME persistente para devolver el launcher real en ACTIVE (1.2.2)
        shell: bash
        run: |
          set -euo pipefail
          DEVICE="$PROJECT_DIR/android/app/src/main/java/com/credixcel/control/device/DeviceActions.kt"
          BUILD="$PROJECT_DIR/android/app/build.gradle.kts"
          python3 - "$DEVICE" "$BUILD" <<'PY'
          import pathlib, sys
          device_path, build_path = map(pathlib.Path, sys.argv[1:])
          source = device_path.read_text()
          start = source.find("    fun clearKioskConfiguration(context: Context): Boolean {")
          end = source.find("\n    fun applyUninstallPolicy", start)
          if start < 0 or end < 0:
              raise SystemExit("No se encontró clearKioskConfiguration; se cancela sin modificar.")
          replacement = """    /**
           * Release CREDIXCEL as HOME by assigning the persistent HOME intent to the
           * installed system launcher. Merely clearing CREDIXCEL's preference can
           * leave Android's HOME role holder pointing back to this app.
           */
          fun clearKioskConfiguration(context: Context): Boolean {
              if (!isDeviceOwner(context)) return false
              return try {
                  val manager = dpm(context)
                  val homeIntent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME)
                      .addCategory(Intent.CATEGORY_DEFAULT)
                  val launcher = context.packageManager.queryIntentActivities(
                      homeIntent, android.content.pm.PackageManager.MATCH_DEFAULT_ONLY
                  ).asSequence()
                      .filter { item ->
                          val info = item.activityInfo
                          info.packageName != context.packageName &&
                              runCatching {
                                  val app = context.packageManager.getApplicationInfo(info.packageName, 0)
                                  (app.flags and android.content.pm.ApplicationInfo.FLAG_SYSTEM) != 0
                              }.getOrDefault(false)
                      }
                      .sortedWith(
                          compareByDescending<android.content.pm.ResolveInfo> { it.priority }
                              .thenByDescending { it.isDefault }
                              .thenByDescending { it.preferredOrder }
                              .thenBy { it.activityInfo.packageName }
                      )
                      .map { it.activityInfo }
                      .firstOrNull() ?: return false
      
                  val filter = IntentFilter(Intent.ACTION_MAIN).apply {
                      addCategory(Intent.CATEGORY_HOME)
                      addCategory(Intent.CATEGORY_DEFAULT)
                  }
      
                  // Replace the CREDIXCEL persistent HOME with Android's real system launcher.
                  manager.clearPackagePersistentPreferredActivities(admin(context), context.packageName)
                  manager.addPersistentPreferredActivity(
                      admin(context),
                      filter,
                      ComponentName(launcher.packageName, launcher.name)
                  )
                  manager.setLockTaskPackages(admin(context), emptyArray<String>())
      
                  // Verify that Android now resolves HOME outside CREDIXCEL.
                  val resolved = context.packageManager.resolveActivity(
                      homeIntent, android.content.pm.PackageManager.MATCH_DEFAULT_ONLY
                  )?.activityInfo
                  resolved != null && resolved.packageName != context.packageName &&
                      !manager.isLockTaskPermitted(context.packageName)
              } catch (_: SecurityException) {
                  false
              } catch (_: IllegalStateException) {
                  false
              } catch (_: IllegalArgumentException) {
                  false
              }
          }
          """
          source = source[:start] + replacement + source[end:]
          required = [
              "manager.clearPackagePersistentPreferredActivities(admin(context), context.packageName)",
              "manager.addPersistentPreferredActivity(",
              "ComponentName(launcher.packageName, launcher.name)",
              "resolved.packageName != context.packageName",
          ]
          if not all(item in source for item in required):
              raise SystemExit("La asignación del launcher externo no superó la validación.")
          device_path.write_text(source)

          build = build_path.read_text()
          if 'versionName = "1.2.1"' not in build or "versionCode = 22" not in build:
              raise SystemExit("La versión de entrada no es 1.2.1 / código 22.")
          build = build.replace("versionCode = 22", "versionCode = 23", 1)
          build = build.replace('versionName = "1.2.1"', 'versionName = "1.2.2"', 1)
          build_path.write_text(build)
          print("OK: ACTIVE asignará HOME persistente al launcher del sistema y verificará que HOME ya no resuelva a CREDIXCEL. Versión 1.2.2.")
          PY

      - name: Ejecutar liberación al terminar sincronización manual y versionar 1.2.3
        shell: bash
        run: |
          set -euo pipefail
          MAIN="$PROJECT_DIR/android/app/src/main/java/com/credixcel/control/MainActivity.kt"
          BUILD="$PROJECT_DIR/android/app/build.gradle.kts"
          python3 - "$MAIN" "$BUILD" <<'PY'
          import pathlib, sys
          main_path, build_path = map(pathlib.Path, sys.argv[1:])
          source = main_path.read_text()
          sync_start = source.find("val state = buildApi(server).sync(")
          if sync_start < 0:
              raise SystemExit("No se encontró la sincronización manual.")
          auth_line = source.find("if (device == \"ACTIVE\" && contract == \"ACTIVE\") System.currentTimeMillis() else 0L", sync_start)
          if auth_line < 0:
              raise SystemExit("No se encontró la autorización temporal ACTIVE + ACTIVE.")
          message_line = source.find("serverMessage =", auth_line)
          if message_line < 0:
              raise SystemExit("No se encontró serverMessage después de la autorización.")
          line_end = source.find("\n", message_line)
          if line_end < 0:
              raise SystemExit("La asignación serverMessage no termina en una línea.")
          line_start = source.rfind("\n", 0, message_line) + 1
          indent = source[line_start:message_line]
          insertion = (
              indent + 'if (device == "ACTIVE" && contract == "ACTIVE" && prefs.protectionActive) {\n' +
              indent + '    prefs.pendingRelease = true\n' +
              indent + '    serverMessage = releaseKiosk()\n' +
              indent + '}\n'
          )
          if "serverMessage = releaseKiosk()" not in source:
              source = source[:line_end + 1] + insertion + source[line_end + 1:]
          else:
              raise SystemExit("Ya existe una llamada directa a releaseKiosk en la sincronización manual.")
          checks = {
              "la llamada está dentro de la sincronización manual": source.find("serverMessage = releaseKiosk()", sync_start) > sync_start,
              "solo libera con ACTIVE + ACTIVE": 'if (device == "ACTIVE" && contract == "ACTIVE" && prefs.protectionActive)' in source,
              "marca liberación pendiente antes de ejecutarla": source.find("prefs.pendingRelease = true", sync_start) < source.find("serverMessage = releaseKiosk()", sync_start),
              "la autorización temporal se calcula antes de liberar": auth_line < source.find("serverMessage = releaseKiosk()", sync_start),
          }
          for label, ok in checks.items():
              print(("OK: " if ok else "ERROR: ") + label)
          if not all(checks.values()):
              raise SystemExit("Falló la validación de liberación desde sincronización manual.")
          build = build_path.read_text()
          if 'versionName = "1.2.2"' not in build or "versionCode = 23" not in build:
              raise SystemExit("La fuente no coincide con 1.2.2 / código 23.")
          build = build.replace("versionCode = 23", "versionCode = 24", 1)
          build = build.replace('versionName = "1.2.2"', 'versionName = "1.2.3"', 1)
          if 'versionName = "1.2.3"' not in build or "versionCode = 24" not in build:
              raise SystemExit("No se pudo versionar 1.2.3.")
          main_path.write_text(source)
          build_path.write_text(build)
          print("OK: ACTIVE + ACTIVE ejecuta releaseKiosk inmediatamente al terminar la sincronización manual; versión 1.2.3.")
          PY

      - name: Publicar fuente exacta compilada
        uses: actions/upload-artifact@v4
        with:
          name: CREDIXCEL-Control-Fuente-1.2.2
          path: |
            buildsrc/**/CREDIXCEL-Control/android/app/src/**
            buildsrc/**/CREDIXCEL-Control/android/app/build.gradle.kts
            buildsrc/**/CREDIXCEL-Control/build.gradle.kts
            buildsrc/**/CREDIXCEL-Control/settings.gradle.kts
            buildsrc/**/CREDIXCEL-Control/gradle.properties
          if-no-files-found: error
          retention-days: 3

      - name: Preparar firma
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Falta el secreto ANDROID_KEYSTORE_BASE64."; exit 1; }
          mkdir -p "$RUNNER_TEMP/credixcel-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/credixcel-signing/credixcel-release.jks"
          test -s "$RUNNER_TEMP/credixcel-signing/credixcel-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/credixcel-signing/credixcel-release.jks" >> "$GITHUB_ENV"

      - name: Compilar APK Release
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle :android:app:assembleRelease --no-daemon

      - name: Verificar firma y versión
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/android/app/build/outputs/apk/release" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK" || { echo "No se generó APK Release."; exit 1; }
          echo "APK generado: $APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer -print -quit)"
          test -n "$APKANALYZER"
          "$APKANALYZER" manifest version-code "$APK"
          "$APKANALYZER" manifest version-name "$APK"
          "$APKANALYZER" manifest application-id "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/CREDIXCEL-Control-1.2.2.apk"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: CREDIXCEL-Control-1.2.2-Release
          path: CREDIXCEL-Control-1.2.2.apk
          if-no-files-found: error
          retention-days: 30
