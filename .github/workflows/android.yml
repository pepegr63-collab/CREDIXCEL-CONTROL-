          if 'var pendingRelease:' not in prefs:
              anchor = '    var lastDeviceStatus: String?'
              if anchor not in prefs:
                  raise SystemExit("No se encontró el punto de inserción de Prefs.")
              prefs = prefs.replace(anchor, '''    /** Server approved release; the foreground Activity must finish Lock Task and HOME handoff. */
              var pendingRelease: Boolean
                  get() = p.getBoolean("pending_release", false)
                  set(value) { p.edit().putBoolean("pending_release", value).commit() }

              ''' + anchor, 1)

          # Schedule a network-constrained periodic sync; WorkManager persists it across reboot.
          imports = [
              "import androidx.work.Constraints",
              "import androidx.work.ExistingPeriodicWorkPolicy",
              "import androidx.work.NetworkType",
              "import androidx.work.PeriodicWorkRequestBuilder",
              "import androidx.work.WorkManager",
              "import com.credixcel.control.sync.ServerSyncWorker",
              "import java.util.concurrent.TimeUnit",
              "import android.widget.Toast",
          ]
          for item in imports:
              if item not in main:
                  main = main.replace("import android.app.ActivityManager", "import android.app.ActivityManager\n" + item, 1)

          if "scheduleServerSync()" not in main:
              main = main.replace(
                  "        setContent { App(prefs) }",
                  "        scheduleServerSync()\n        setContent { App(prefs) }",
                  1
              )
          if "private fun scheduleServerSync()" not in main:
              anchor = "    /** A previously authorized kiosk is re-entered whenever Android recreates this HOME activity. */"
              method = '''    /** WorkManager checks the server at Android's minimum periodic interval (15 minutes). */
              private fun scheduleServerSync() {
                  val constraints = Constraints.Builder()
                      .setRequiredNetworkType(NetworkType.CONNECTED)
                      .build()
                  val request = PeriodicWorkRequestBuilder<ServerSyncWorker>(15, TimeUnit.MINUTES)
                      .setConstraints(constraints)
                      .build()
                  WorkManager.getInstance(applicationContext).enqueueUniquePeriodicWork(
                      ServerSyncWorker.WORK_NAME,
                      ExistingPeriodicWorkPolicy.UPDATE,
                      request
                  )
              }

              '''
              if anchor not in main:
                  raise SystemExit("No se encontró onResume para insertar la programación periódica.")
              main = main.replace(anchor, method + anchor, 1)

          # A pending ACTIVE+ACTIVE command is completed only while this Activity is foreground.
          import re
          pattern = r'        if \(!::prefs\.isInitialized \|\| !prefs\.protectionActive\) return\s+if \(DeviceActions\.configureKiosk\(this\) && DeviceActions\.isLockTaskPermitted\(this\)\) \{'
          new_resume = '''        if (!::prefs.isInitialized) return
                  if (prefs.pendingRelease) {
                      val result = releaseKiosk()
                      if (prefs.pendingRelease) {
                          Toast.makeText(this, result, Toast.LENGTH_LONG).show()
                      }
                      return
                  }
                  if (!prefs.protectionActive) return

                  if (DeviceActions.configureKiosk(this) && DeviceActions.isLockTaskPermitted(this)) {'''
          main, replaced = re.subn(pattern, lambda _: new_resume, main, count=1)
          if replaced != 1:
              raise SystemExit("No se encontró la estructura real de onResume; se cancela sin tocar el código.")

          # Clear the durable marker in the successful release branch, independent of indentation.
          if "prefs.pendingRelease = false" not in main:
              import re
              main, cleared = re.subn(
                  r"(\n[ \t]*)prefs\.protectionActive = false(\s*\n[ \t]*finish\(\))",
                  lambda m: m.group(1) + "prefs.protectionActive = false" + m.group(1) + "prefs.pendingRelease = false" + m.group(2),
                  main,
                  count=1
              )
              if cleared != 1:
                  raise SystemExit("No se encontró el bloque final de releaseKiosk para limpiar pendingRelease.")
          if "prefs.pendingRelease = false" not in main:
              raise SystemExit("No se pudo limpiar el marcador tras liberar correctamente.")

          if "android.permission.POST_NOTIFICATIONS" not in manifest:
              manifest = manifest.replace(
                  '    <uses-permission android:name="android.permission.INTERNET" />',
                  '    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
                  1
              )

          if "versionCode = 16" not in build or 'versionName = "1.1.5"' not in build:
              raise SystemExit("La fuente no coincide con 1.1.5 antes del versionado.")
          build = build.replace("versionCode = 16", "versionCode = 17", 1)
          build = build.replace('versionName = "1.1.5"', 'versionName = "1.1.6"', 1)

          # Assertions validate the actual patched files.
          assert "PeriodicWorkRequestBuilder<ServerSyncWorker>(15, TimeUnit.MINUTES)" in main
          assert "ExistingPeriodicWorkPolicy.UPDATE" in main
          assert "if (prefs.pendingRelease)" in main
          assert "prefs.pendingRelease = false" in main
          assert "var pendingRelease: Boolean" in prefs
          assert 'device == "ACTIVE" && contract == "ACTIVE"' in pathlib.Path(sys.argv[1]).read_text()
