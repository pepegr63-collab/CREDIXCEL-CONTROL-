name: Compilar CREDIXCEL Control

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android.yml"
      - "CREDIXCEL-Control-v1-DeviceOwner-FRP.zip"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extraer proyecto Android
        run: |
          unzip -o CREDIXCEL-Control-v1-DeviceOwner-FRP-fixed.zip -d buildsrc
          test -f buildsrc/CREDIXCEL-Control/settings.gradle.kts

      - name: Compilar APK
        run: |
          cd buildsrc/CREDIXCEL-Control
          gradle :android:app:assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: CREDIXCEL-Control-debug
          path: buildsrc/CREDIXCEL-Control/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
