          indent = lines[message_index][:len(lines[message_index]) - len(lines[message_index].lstrip())]
          lines.insert(message_index, indent + "prefs.releaseAuthorizationAt =\n")
          lines.insert(message_index + 1, indent + '    if (device == "ACTIVE" && contract == "ACTIVE") System.currentTimeMillis() else 0L\n')
          main = "".join(lines)

          # Replace the 1.1.8 guard using semantic anchors, independent of indentation.
          guard_start_token = 'if (prefs.lastDeviceStatus?.trim()?.uppercase() != "ACTIVE" ||'
          guard_start = main.find(guard_start_token)
          if guard_start < 0:
              raise SystemExit("No se encontró el inicio del guard de liberación 1.1.8.")
          guard_line_start = main.rfind("\n", 0, guard_start) + 1
          old_return = 'return "Liberación cancelada: el último estado confirmado no es ACTIVE + ACTIVE. Se conserva la protección."'
          return_pos = main.find(old_return, guard_start)
          if return_pos < 0:
              raise SystemExit("No se encontró el mensaje del guard de liberación 1.1.8.")
          return_line_end = main.find("\n", return_pos)
          if return_line_end < 0:
              raise SystemExit("El guard de liberación está truncado.")
          close_line_start = return_line_end + 1
          close_line_end = main.find("\n", close_line_start)
          if close_line_end < 0: close_line_end = len(main)
          if main[close_line_start:close_line_end].strip() != "}":
              raise SystemExit("El cierre del guard de liberación no coincide; se cancela el parche.")
          indent = main[guard_line_start:guard_start]
          body_indent = indent + "    "
          new_guard = (
              indent + "val authorizationAge = System.currentTimeMillis() - prefs.releaseAuthorizationAt\n" +
              indent + 'if (prefs.lastDeviceStatus?.trim()?.uppercase() != "ACTIVE" ||\n' +
              body_indent + 'prefs.lastContractStatus?.trim()?.uppercase() != "ACTIVE" ||\n' +
              body_indent + 'prefs.releaseAuthorizationAt <= 0L ||\n' +
              body_indent + 'authorizationAge < 0L || authorizationAge > 5 * 60 * 1000L) {\n' +
              body_indent + "prefs.pendingRelease = false\n" +
              body_indent + "prefs.releaseAuthorizationAt = 0L\n" +
              body_indent + 'return "Liberación cancelada: se requiere confirmación ACTIVE + ACTIVE reciente (máximo 5 minutos). Se conserva la protección."\n' +
              indent + "}"
          )
          main = main[:guard_line_start] + new_guard + main[close_line_end:]
          main = main.replace('''                                } catch (e: Exception) {
                                    prefs.pendingRelease = false
                                    // Network/authentication failures''',
              '''                                } catch (e: Exception) {
                                    prefs.releaseAuthorizationAt = 0L
                                    prefs.pendingRelease = false
                                    // Network/authentication failures''', 1)

          # Invalidar también la marca temporal cuando falla la sincronización manual.
          sync_start = main.find("val state = buildApi(server).sync(")
          if sync_start < 0:
              raise SystemExit("No se encontró el inicio de sincronización manual.")
          sync_catch = main.find("} catch (e: Exception) {", sync_start)
          if sync_catch < 0:
              raise SystemExit("No se encontró catch de sincronización manual.")
          catch_end = main.find("\n", sync_catch)
          if "prefs.releaseAuthorizationAt = 0L" not in main[catch_end:catch_end + 180]:
              insert_at = catch_end + 1
              indent = main[main.rfind("\n", 0, sync_catch) + 1:sync_catch]
              main = main[:insert_at] + indent + "    prefs.releaseAuthorizationAt = 0L\n" + main[insert_at:]

          # Replace the method by locating its signature and matching braces; whitespace is irrelevant.
          method_signature = "private fun enterLockTaskIfAuthorized()"
          method_start = main.find(method_signature)
          if method_start < 0: raise SystemExit("No se encontró la firma enterLockTaskIfAuthorized.")
          method_line_start = main.rfind("\n", 0, method_start) + 1
          method_open = main.find("{", method_start)
          if method_open < 0: raise SystemExit("Método enterLockTaskIfAuthorized sin apertura.")
          depth = 0
          method_end = -1
          for pos in range(method_open, len(main)):
              if main[pos] == "{": depth += 1
              elif main[pos] == "}":
                  depth -= 1
                  if depth == 0:
                      method_end = pos + 1
                      break
          if method_end < 0: raise SystemExit("Método enterLockTaskIfAuthorized sin cierre.")
          new_enter = '''    private fun enterLockTaskIfAuthorized(): Boolean {
              if (!DeviceActions.isDeviceOwner(this)) return false
              if (!DeviceActions.configureKiosk(this) || !DeviceActions.isLockTaskPermitted(this)) return false
              return runCatching {
                  val manager = getSystemService(ActivityManager::class.java)
                  if (manager.lockTaskModeState == ActivityManager.LOCK_TASK_MODE_NONE) startLockTask()
                  manager.lockTaskModeState == ActivityManager.LOCK_TASK_MODE_LOCKED
              }.getOrDefault(false)
          }'''
          main = main[:method_line_start] + new_enter + main[method_end:]

          resume_anchor = "if (DeviceActions.configureKiosk(this) && DeviceActions.isLockTaskPermitted(this))"
          resume_start = main.find(resume_anchor)
          if resume_start < 0: raise SystemExit("No se encontró condición de Lock Task en onResume.")
          resume_open = main.find("{", resume_start)
          depth = 0
          resume_end = -1
          for pos in range(resume_open, len(main)):
              if main[pos] == "{": depth += 1
              elif main[pos] == "}":
                  depth -= 1
                  if depth == 0:
                      resume_end = pos + 1
                      break
          if resume_end < 0: raise SystemExit("Bloque Lock Task de onResume sin cierre.")
          new_resume = '''if (!enterLockTaskIfAuthorized()) {
                      Toast.makeText(this, "CREDIXCEL conserva la autorización LOCKED, pero Android aún no confirmó Lock Task.", Toast.LENGTH_LONG).show()
                  }'''
          main = main[:resume_start] + new_resume + main[resume_end:]

          # Add the real Lock Task confirmation inside activateKiosk without matching indentation.
          activate_token = "private fun activateKiosk(): String"
          activate_pos = main.find(activate_token)
          if activate_pos < 0: raise SystemExit("No se encontró activateKiosk.")
          activate_open = main.find("{", activate_pos)
          depth = 0
          activate_end = -1
          for pos in range(activate_open, len(main)):
              if main[pos] == "{": depth += 1
              elif main[pos] == "}":
                  depth -= 1
                  if depth == 0:
                      activate_end = pos
                      break
          if activate_end < 0: raise SystemExit("activateKiosk sin cierre.")
          activate_body = main[activate_pos:activate_end]
          lock_call = "startLockTask()"
          lock_pos = activate_body.find(lock_call)
          if lock_pos < 0: raise SystemExit("activateKiosk no contiene startLockTask().")
          after_call = lock_pos + len(lock_call)
          guard = '''
                    if (manager.lockTaskModeState != ActivityManager.LOCK_TASK_MODE_LOCKED) {
                        return "La autorización LOCKED quedó guardada y las políticas aplicadas, pero Android no confirmó el modo Lock Task."
                    }'''
          if "Android no confirmó el modo Lock Task." not in activate_body:
              activate_body = activate_body[:after_call] + guard + activate_body[after_call:]
              main = main[:activate_pos] + activate_body + main[activate_end:]

          main = main.replace(
              'manager.lockTaskModeState != ActivityManager.LOCK_TASK_MODE_NONE\n                    }.getOrDefault(false)',
              'manager.lockTaskModeState == ActivityManager.LOCK_TASK_MODE_LOCKED\n                    }.getOrDefault(false)', 1
          )

          # If a pending release expires before Activity resumes, restore LOCKED in the same resume.
          # Parse onResume braces instead of relying on whitespace in the ZIP source.
          resume_method = main.find("override fun onResume()")
          if resume_method < 0:
              raise SystemExit("No se encontró onResume para proteger el retorno.")
          resume_open = main.find("{", resume_method)
          depth = 0
          resume_method_end = -1
          for pos in range(resume_open, len(main)):
              if main[pos] == "{": depth += 1
              elif main[pos] == "}":
                  depth -= 1
                  if depth == 0:
                      resume_method_end = pos
                      break
          if resume_method_end < 0:
              raise SystemExit("onResume no tiene cierre.")
          resume_segment = main[resume_method:resume_method_end]
          marker = "// A stale authorization was rejected; continue and restore LOCKED below."
          if marker not in resume_segment:
              pending_start = resume_segment.find("if (prefs.pendingRelease)")
              if pending_start < 0:
                  raise SystemExit("No se encontró pendingRelease dentro de onResume.")
              pending_open = resume_segment.find("{", pending_start)
              depth = 0
              pending_end = -1
              for pos in range(pending_open, len(resume_segment)):
                  if resume_segment[pos] == "{": depth += 1
                  elif resume_segment[pos] == "}":
                      depth -= 1
                      if depth == 0:
                          pending_end = pos + 1
                          break
              if pending_end < 0:
                  raise SystemExit("El bloque pendingRelease de onResume no tiene cierre.")
              new_pending = '''if (prefs.pendingRelease) {
                      val result = releaseKiosk()
                      if (prefs.pendingRelease) {
                          Toast.makeText(this, result, Toast.LENGTH_LONG).show()
                          return
                      }
                      // A stale authorization was rejected; continue and restore LOCKED below.
                  }'''
              resume_segment = resume_segment[:pending_start] + new_pending + resume_segment[pending_end:]
              main = main[:resume_method] + resume_segment + main[resume_method_end:]
          else:
              if "if (!prefs.protectionActive) return" not in resume_segment or "enterLockTaskIfAuthorized()" not in resume_segment:
                  raise SystemExit("La recuperación LOCKED tras autorización caducada está incompleta.")


          if 'versionName = "1.1.8"' not in build or "versionCode = 19" not in build:
              raise SystemExit("Versión base distinta de 1.1.8 / código 19.")
          build = build.replace("versionCode = 19", "versionCode = 20", 1)
          build = build.replace('versionName = "1.1.8"', 'versionName = "1.1.9"', 1)

          for token in ["releaseAuthorizationAt", "authorizationAge > 5 * 60 * 1000L",
                        "LOCK_TASK_MODE_LOCKED", "enterLockTaskIfAuthorized(): Boolean"]:
              if token not in main: raise SystemExit("Falta MainActivity: " + token)
          for token in ["release_authorization_at", "var releaseAuthorizationAt: Long"]:
              if token not in prefs: raise SystemExit("Falta Prefs: " + token)
          for token in ["releaseAuthorizationAt = System.currentTimeMillis()", "releaseAuthorizationAt = 0L"]:
              if token not in worker: raise SystemExit("Falta Worker: " + token)
          if 'versionName = "1.1.9"' not in build or "versionCode = 20" not in build:
              raise SystemExit("Versionado 1.1.9 incompleto.")
          mp.write_text(main); pp.write_text(prefs); wp.write_text(worker); bp.write_text(build)
          print("OK: autorización temporal, invalidación ante errores/estados inciertos y verificación real de Lock Task; 1.1.9.")
          PY

      - name: Corregir selección del HOME real y versionar 1.2.0
        shell: bash
        run: |
          set -euo pipefail
          MAIN="$PROJECT_DIR/android/app/src/main/java/com/credixcel/control/MainActivity.kt"
          BUILD="$PROJECT_DIR/android/app/build.gradle.kts"
          python3 - "$MAIN" "$BUILD" <<'PY'
          import pathlib, sys
          main_path, build_path = map(pathlib.Path, sys.argv[1:])
          s = main_path.read_text()
          anchor = "private fun openSystemHome(): Boolean"
          start = s.find(anchor)
          if start < 0: raise SystemExit("No se encontró openSystemHome.")
          method_open = s.find("{", start)
          depth = 0
          end = -1
          for pos in range(method_open, len(s)):
              if s[pos] == "{": depth += 1
              elif s[pos] == "}":
                  depth -= 1
                  if depth == 0:
                      end = pos + 1
                      break
          if end < 0: raise SystemExit("openSystemHome no tiene cierre.")
          replacement = """private fun openSystemHome(): Boolean {
              val homeIntent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME)
              val resolved = packageManager.resolveActivity(
                  homeIntent,
                  PackageManager.MATCH_DEFAULT_ONLY
              )?.activityInfo

              fun isExternalHome(info: android.content.pm.ActivityInfo?): Boolean =
                  info != null && info.packageName != packageName &&
                      !info.name.endsWith(".ResolverActivity")

              // CREDIXCEL is itself declared as HOME. Once its persistent preference is
              // cleared, Android can resolve to ResolverActivity; select the real system
              // launcher instead of treating the chooser as failure and restoring kiosk.
              val systemHome = packageManager.queryIntentActivities(
                  homeIntent, PackageManager.MATCH_DEFAULT_ONLY
              ).filter { item ->
                  val info = item.activityInfo
                  isExternalHome(info) && runCatching {
                      val app = packageManager.getApplicationInfo(info.packageName, 0)
                      (app.flags and android.content.pm.ApplicationInfo.FLAG_SYSTEM) != 0
                  }.getOrDefault(false)
              }.sortedWith(
                  compareByDescending<android.content.pm.ResolveInfo> { it.priority }
                      .thenByDescending { it.isDefault }
                      .thenByDescending { it.preferredOrder }
                      .thenBy { it.activityInfo.packageName }
              ).firstOrNull()?.activityInfo

              val launcher = resolved?.takeIf { isExternalHome(it) } ?: systemHome ?: return false
              val homeComponent = android.content.ComponentName(launcher.packageName, launcher.name)
              return runCatching {
                  startActivity(homeIntent.apply {
                      component = homeComponent
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                  })
                  true
              }.getOrDefault(false)
          }"""
          s = s[:start] + replacement + s[end:]
          if "queryIntentActivities(" not in s or "ApplicationInfo.FLAG_SYSTEM" not in s:
              raise SystemExit("No quedó incorporada la selección alternativa del HOME.")
          b = build_path.read_text()
          if 'versionName = "1.1.9"' not in b or "versionCode = 20" not in b:
              raise SystemExit("La fuente no coincide con 1.1.9 / código 20.")
          b = b.replace("versionCode = 20", "versionCode = 21", 1)
          b = b.replace('versionName = "1.1.9"', 'versionName = "1.2.0"', 1)
          main_path.write_text(s)
          build_path.write_text(b)
          print("OK: selección del HOME real del sistema y versión 1.2.0.")
          PY

      - name: Corregir liberación asíncrona de Lock Task y versionar 1.2.1
        shell: bash
        run: |
          set -euo pipefail
          MAIN="$PROJECT_DIR/android/app/src/main/java/com/credixcel/control/MainActivity.kt"
          BUILD="$PROJECT_DIR/android/app/build.gradle.kts"
          python3 - "$MAIN" "$BUILD" <<'PY'
          import pathlib, sys
          main_path, build_path = map(pathlib.Path, sys.argv[1:])
          source = main_path.read_text()
          build = build_path.read_text()

          class_anchor = "class MainActivity : ComponentActivity() {"
          if class_anchor not in source:
              raise SystemExit("No se encontró MainActivity.")
          if "private var releaseInProgress = false" not in source:
              source = source.replace(
                  class_anchor,
                  class_anchor + "\n    @Volatile private var releaseInProgress = false",
                  1
              )

          start_token = "private fun releaseKiosk(): String {"
          start = source.find(start_token)
          end = source.find("\n\n    @Composable", start)
          if start < 0 or end < 0:
              raise SystemExit("No se encontró el límite exacto de releaseKiosk.")
          replacement = r"""private fun releaseKiosk(): String {
                  if (releaseInProgress) return "La liberación ya está en curso; espera la confirmación de Android."
                  val authorizationAge = System.currentTimeMillis() - prefs.releaseAuthorizationAt
                  if (prefs.lastDeviceStatus?.trim()?.uppercase() != "ACTIVE" ||
                      prefs.lastContractStatus?.trim()?.uppercase() != "ACTIVE" ||
                      prefs.releaseAuthorizationAt <= 0L ||
                      authorizationAge < 0L || authorizationAge > 5 * 60 * 1000L) {
                      prefs.pendingRelease = false
                      prefs.releaseAuthorizationAt = 0L
                      return "Liberación cancelada: se requiere confirmación ACTIVE + ACTIVE reciente. Se conserva la protección."
                  }
                  if (!DeviceActions.isDeviceOwner(this)) {
                      return "CREDIXCEL ya no es Device Owner. Se conserva el estado local."
                  }

                  releaseInProgress = true
                  val policiesReleased = DeviceActions.releaseFinancingProtection(this)
                  if (!policiesReleased) {
                      releaseInProgress = false
                      val rollback = restoreKioskAfterFailedRelease()
                      prefs.pendingRelease = false
                      prefs.releaseAuthorizationAt = 0L
                      android.widget.Toast.makeText(
                          this, "No se pudieron retirar todas las políticas. Protección restaurada: $rollback",
                          android.widget.Toast.LENGTH_LONG
                      ).show()
                      return "No se pudieron retirar todas las políticas; se restauró la protección."
                  }

                  val manager = getSystemService(ActivityManager::class.java)
                  val stopRequested = runCatching {
                      if (manager.lockTaskModeState != ActivityManager.LOCK_TASK_MODE_NONE) stopLockTask()
                      true
                  }.getOrDefault(false)

                  fun failRelease(reason: String) {
                      releaseInProgress = false
                      val rollback = runCatching { restoreKioskAfterFailedRelease() }.getOrDefault(false)
                      prefs.protectionActive = true
                      prefs.pendingRelease = false
                      prefs.releaseAuthorizationAt = 0L
                      android.widget.Toast.makeText(
                          this, "$reason. Protección restaurada: $rollback",
                          android.widget.Toast.LENGTH_LONG
                      ).show()
                  }

                  if (!stopRequested) {
                      failRelease("Android rechazó la solicitud de salida de Lock Task")
                      return "Android rechazó la solicitud de salida; se conserva la protección."
                  }

                  // stopLockTask() is a Binder request. Android may update ActivityManager
                  // after this call returns, so never read lockTaskModeState as an immediate
                  // success/failure signal and never roll the device back on that stale value.
                  val handler = android.os.Handler(android.os.Looper.getMainLooper())
                  val startedAt = android.os.SystemClock.elapsedRealtime()
                  lateinit var verifyExit: Runnable
                  verifyExit = Runnable {
                      if (isFinishing || isDestroyed) {
                          failRelease("La actividad terminó antes de confirmar la liberación")
                      } else if (manager.lockTaskModeState != ActivityManager.LOCK_TASK_MODE_NONE) {
                          if (android.os.SystemClock.elapsedRealtime() - startedAt < 5000L) {
                              handler.postDelayed(verifyExit, 150L)
                          } else {
                              failRelease("Android no confirmó la salida de Lock Task después de 5 segundos")
                          }
                      } else {
                          val kioskCleared = DeviceActions.clearKioskConfiguration(this)
                          if (!kioskCleared) {
                              failRelease("No se pudo limpiar la configuración de kiosco")
                          } else {
                              val homeOpened = openSystemHome()
                              if (!homeOpened) {
                                  failRelease("No se pudo abrir el launcher original del Motorola")
                              } else {
                                  // Report ACTIVE locally only after Android has left Lock Task,
                                  // kiosk policies are cleared, and the external HOME was launched.
                                  prefs.protectionActive = false
                                  prefs.lockCommandReady = false
                                  prefs.pendingRelease = false
                                  prefs.releaseAuthorizationAt = 0L
                                  releaseInProgress = false
                                  finish()
                              }
                          }
                      }
                  }
                  handler.postDelayed(verifyExit, 150L)
                  return "Orden ACTIVE + ACTIVE aceptada. Esperando confirmación real de Android para salir del modo kiosco."
              }"""
          source = source[:start] + replacement + source[end:]

          if 'versionName = "1.2.0"' not in build or "versionCode = 21" not in build:
              raise SystemExit("La fuente no coincide con 1.2.0 / código 21.")
          build = build.replace("versionCode = 21", "versionCode = 22", 1)
          build = build.replace('versionName = "1.2.0"', 'versionName = "1.2.1"', 1)

          checks = {
              "espera asincrónica por estado NONE": "handler.postDelayed(verifyExit, 150L)" in source and "LOCK_TASK_MODE_NONE" in source,
              "no interpreta como fallo el estado Binder inmediato": "never read lockTaskModeState as an immediate" in source,
              "tiempo máximo de confirmación": " < 5000L" in source,
              "no limpia kiosco antes de salir de Lock Task": source.index("manager.lockTaskModeState != ActivityManager.LOCK_TASK_MODE_NONE") < source.index("DeviceActions.clearKioskConfiguration(this)", source.index(start_token)),
              "ACTIVE local solo después de HOME externo": source.index("val homeOpened = openSystemHome()") < source.index("prefs.protectionActive = false", source.index(start_token)),
              "evita liberaciones duplicadas": "releaseInProgress" in source,
              "versión 1.2.1 / código 22": 'versionName = "1.2.1"' in build and "versionCode = 22" in build,
          }
          for label, ok in checks.items():
              print(("OK: " if ok else "ERROR: ") + label)
          if not all(checks.values()):
              raise SystemExit("Falló la validación de liberación asíncrona.")
          main_path.write_text(source)
          build_path.write_text(build)
          print("OK: liberación asíncrona confirmada por Android; versión 1.2.1.")
          PY

